server:
  port: 9090

spring:
  application:
    name: mes-backend
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    # 접속 정보는 환경변수로 주입한다(레포에 실제 비밀번호를 커밋하지 않기 위함).
    # 실행 전: DB_USERNAME, DB_PASSWORD 필수 / DB_HOST, DB_PORT, DB_NAME은 기본값 있음
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_ym_pro}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # DB가 아직 준비되지 않아도 서버 기동은 되도록 함
      initialization-fail-timeout: -1
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# sample_pro가 쓰는 기존 ez_scada(모니터링/알람/온도/PLC 실데이터). 새 스키마 아님 — 기존 DB에 직접 연결.
# 실행 전: EZSCADA_DB_USERNAME, EZSCADA_DB_PASSWORD 필수(sample_pro의 root-context.xml과 같은 값).
ezscada:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${EZSCADA_DB_HOST:localhost}:${EZSCADA_DB_PORT:3306}/${EZSCADA_DB_NAME:ez_scada}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${EZSCADA_DB_USERNAME}
    password: ${EZSCADA_DB_PASSWORD}

# 조건관리 > 일상점검일지 첨부파일 저장 경로 — 머신마다 다를 수 있어 환경변수로 오버라이드 가능.
app:
  upload-dir: ${UPLOAD_DIR:./uploads/dailycheck}
  # 조건관리 > 관리계획서 및 작업표준서 문서 파일 저장 경로.
  standard-upload-dir: ${STANDARD_UPLOAD_DIR:./uploads/standard}
  # 조건관리 > 조절계 관리(정도검사 이력) 첨부파일(상/하반기 성적서) 저장 경로.
  controller-upload-dir: ${CONTROLLER_UPLOAD_DIR:./uploads/controller}
  # 조건관리 > 열처리유성상분석 첨부파일(분석보고서 등 최대 4종 PDF) 저장 경로.
  oilAnalysis-upload-dir: ${OIL_ANALYSIS_UPLOAD_DIR:./uploads/oilAnalysis}

# PLC 하드웨어와 통신하는 C# API 서버 — sample_pro와 별도 머신에서 돌기 때문에 localhost가 아니라
# 실제 네트워크 주소를 써야 한다.
plc-api:
  base-url: ${PLC_API_BASE_URL:http://localhost:5050}

logging:
  level:
    com.mes: debug
